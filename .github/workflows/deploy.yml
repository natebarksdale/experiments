name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Key (for travel-guide.js)
        run: |
          # Obfuscate the API key (reverse + base64) to prevent casual scraping
          # Note: This is NOT real security - the key is site-locked on OpenRouter
          # Use printf instead of echo to avoid adding newline

          # Debug: Check if secret is set
          if [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "❌ ERROR: OPENROUTER_API_KEY secret is not set!"
            echo "Please set it in: Settings → Secrets and variables → Actions"
            exit 1
          fi

          # Obfuscate the key
          OBFUSCATED=$(printf '%s' "${{ secrets.OPENROUTER_API_KEY }}" | rev | base64 -w 0)

          # Debug: Show obfuscated length (not the actual key)
          echo "Obfuscated key length: ${#OBFUSCATED} chars"
          echo "First 10 chars: ${OBFUSCATED:0:10}..."

          # Replace placeholder
          sed -i "s|__OPENROUTER_API_KEY__|$OBFUSCATED|g" travel-guide.js

          # Verify replacement worked
          if grep -q "__OPENROUTER_API_KEY__" travel-guide.js; then
            echo "❌ ERROR: Placeholder was not replaced!"
            exit 1
          fi

          echo "✅ API key obfuscated and injected successfully"

      - name: Setup deployment directory and copy static files
        run: |
          # Create deployment directory
          mkdir -p _deploy

          # Copy all root-level HTML, CSS, and JS files
          cp *.html _deploy/ 2>/dev/null || true
          cp *.css _deploy/ 2>/dev/null || true
          cp *.js _deploy/ 2>/dev/null || true

          # Copy any other static assets and directories
          cp -r images _deploy/ 2>/dev/null || true
          cp -r blog-composer _deploy/ 2>/dev/null || true
          cp -r cloudflare-worker _deploy/ 2>/dev/null || true
          cp -r data _deploy/ 2>/dev/null || true

          echo "✅ Static files copied to _deploy/"
          ls -la _deploy/

      - name: Check if HVAC secrets are configured
        id: check-hvac-secrets
        run: |
          if [ -n "${{ secrets.VITE_GOOGLE_SHEETS_API_KEY }}" ]; then
            echo "hvac_enabled=true" >> $GITHUB_OUTPUT
            echo "✅ HVAC secrets found - will build HVAC Control app"
          else
            echo "hvac_enabled=false" >> $GITHUB_OUTPUT
            echo "⏭️  HVAC secrets not set - skipping HVAC Control build"
          fi

      - name: Setup Node.js for HVAC Control
        if: steps.check-hvac-secrets.outputs.hvac_enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hvac-control/package-lock.json

      - name: Install dependencies for HVAC Control
        if: steps.check-hvac-secrets.outputs.hvac_enabled == 'true'
        run: |
          cd hvac-control
          npm ci

      - name: Build HVAC Control app
        if: steps.check-hvac-secrets.outputs.hvac_enabled == 'true'
        run: |
          cd hvac-control
          npm run build
        env:
          VITE_USE_PROXY: ${{ secrets.VITE_USE_PROXY }}
          VITE_PROXY_URL: ${{ secrets.VITE_PROXY_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_SHEETS_API_KEY: ${{ secrets.VITE_GOOGLE_SHEETS_API_KEY }}
          VITE_SMARTTHINGS_TOKEN: ${{ secrets.VITE_SMARTTHINGS_TOKEN }}
          VITE_IFTTT_WEBHOOK_KEY: ${{ secrets.VITE_IFTTT_WEBHOOK_KEY }}

      - name: Copy HVAC Control build to deployment directory
        if: steps.check-hvac-secrets.outputs.hvac_enabled == 'true'
        run: |
          # Copy built HVAC app to hvac-control subdirectory for deployment
          mkdir -p _deploy/hvac-control
          cp -r hvac-control/dist/* _deploy/hvac-control/
          echo "✅ HVAC Control app deployed to _deploy/hvac-control/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
