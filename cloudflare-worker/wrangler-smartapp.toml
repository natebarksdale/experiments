# Cloudflare Worker Configuration for SmartThings SmartApp Webhook
# This worker receives real-time temperature updates from SmartThings

name = "smartthings-hvac-webhook"
main = "smartapp-webhook-worker.js"
compatibility_date = "2024-01-01"

# Account details - add your account_id after creating a Cloudflare account
# Get this from: https://dash.cloudflare.com/ → Workers & Pages → Overview → Account ID
account_id = "249f59593886bddaa03326538661d8f5"

# KV namespace for storing temperature data and installation details
# Create this using: wrangler kv:namespace create "SMARTAPP_STORAGE" --config wrangler-smartapp.toml
# Then uncomment and add the ID below:
[[kv_namespaces]]
binding = "SMARTAPP_STORAGE"
id = "6bdb56f9413f49b3a30f84b0b282c115"

# Workers are free up to 100,000 requests per day
# KV is free up to 1,000 write operations per day (free tier)
# KV is free up to 100,000 read operations per day
# https://developers.cloudflare.com/workers/platform/pricing/

# Scheduled Cron Triggers for HVAC Rebalancing
# Runs every 2 hours (12 times per day) for proactive HVAC optimization
# This catches IR remote changes, temperature drift, and mode conflicts
# KV cost: ~24 operations/day (12 runs × 2 KV ops each)
#
# Schedule (in UTC, covers 24-hour period):
# - Every even hour: 00:00, 02:00, 04:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00
[triggers]
crons = [
  "0 */2 * * *"  # Every 2 hours
]

# Optional: Google Sheets webhook URL for syncing temperature data
# Set this using wrangler:
#   wrangler secret put GOOGLE_SHEETS_WEBHOOK_URL --config wrangler-smartapp.toml

# After deployment, your worker will be available at:
# https://hvac-monitor.<your-subdomain>.workers.dev
#
# Use this URL when registering the SmartApp in SmartThings Developer Workspace
