<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" fill="#000000" rx="40"/>
  <g transform="translate(90, 90)">
    <!-- Thermometer icon -->
    <circle cx="0" cy="30" r="20" fill="#ffffff"/>
    <rect x="-8" y="-35" width="16" height="60" fill="#ffffff" rx="8"/>
    <rect x="-4" y="-30" width="8" height="45" fill="#000000" rx="4"/>
    <!-- Temperature marks -->
    <line x1="8" y1="-20" x2="16" y2="-20" stroke="#ffffff" stroke-width="2"/>
    <line x1="8" y1="-10" x2="16" y2="-10" stroke="#ffffff" stroke-width="2"/>
    <line x1="8" y1="0" x2="16" y2="0" stroke="#ffffff" stroke-width="2"/>
    <line x1="8" y1="10" x2="16" y2="10" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
